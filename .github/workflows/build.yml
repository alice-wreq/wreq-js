name: 🏗️ Build and Publish Package

on:
  release:
    types: [published]
  # Backup path if a human publishes a GitHub Release from the UI
  # (softprops + GITHUB_TOKEN does not re-trigger this workflow)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_full:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
            build: npm run build:rust -- --target x86_64-apple-darwin
          - host: macos-14
            target: aarch64-apple-darwin
            arch: arm64
            build: npm run build:rust -- --target aarch64-apple-darwin
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            build: npm run build:rust -- --target x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            build: npm run build:rust -- --target aarch64-unknown-linux-gnu
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: x64
            build: npm run build:rust -- --target x86_64-unknown-linux-musl
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
            build: npm run build:rust -- --target aarch64-unknown-linux-musl
          - host: windows-2022
            target: x86_64-pc-windows-msvc
            arch: x64
            build: npm run build:rust -- --target x86_64-pc-windows-msvc
          

    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    # linux-arm musl optional; win32-x64-msvc is required (x64 only)
    continue-on-error: ${{ contains(matrix.settings.target, 'linux-musl') && contains(matrix.settings.target, 'aarch64') }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: ${{ matrix.settings.arch }}
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ${{ matrix.settings.target }}
          
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y
          ninja --version

      - name: Setup NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Verify NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: nasm -v

      - name: MSVC developer command prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache musl cross toolchain (x86_64-linux-musl)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        uses: actions/cache@v5
        with:
          path: |
            ~/musl-cross
          key: musl-cross-${{ runner.os }}-x86_64-11-20211120

      - name: Install musl cross toolchain (x86_64-linux-musl)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          set -eux
          rustup target add x86_64-unknown-linux-musl

          TOOLCHAIN_URL="https://github.com/troglobit/misc/releases/download/11-20211120/x86_64-linux-musl-cross.tgz"
          TOOLCHAIN_DIR="$HOME/musl-cross/x86_64-linux-musl-cross"

          if [ ! -d "$TOOLCHAIN_DIR" ]; then
            mkdir -p "$HOME/musl-cross"
            curl -L "$TOOLCHAIN_URL" -o /tmp/x86_64-linux-musl-cross.tgz
            tar -xzf /tmp/x86_64-linux-musl-cross.tgz -C "$HOME/musl-cross"
          fi

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci
        env:
          WREQ_JS_SKIP_POSTINSTALL: "1"

      # Note: stack uses btls (not boring-sys2). No Windows source patch required.

      - name: Build native module (x86_64 musl target)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        env:
          # Tell Cargo what we are targeting
          CARGO_BUILD_TARGET: x86_64-unknown-linux-musl

          # Tell rustc which linker to use for that target
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: x86_64-linux-musl-gcc

          # Point boring-sys2 / cc / cmake at the musl cross toolchain
          CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc
          CXX_x86_64_unknown_linux_musl: x86_64-linux-musl-g++
          AR_x86_64_unknown_linux_musl: x86_64-linux-musl-ar
          RANLIB_x86_64_unknown_linux_musl: x86_64-linux-musl-ranlib

          # Optional: keep it static
          RUSTFLAGS: -C target-feature=-crt-static
        run: npm run build:rust

      - name: Build native module (aarch64 musl target)
        if: matrix.settings.target == 'aarch64-unknown-linux-musl'
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            node:20-alpine \
            sh -lc '
              set -eux
              apk add --no-cache rust cargo build-base python3 cmake git clang-dev
              npm ci --ignore-scripts
              npm run build:rust
            '

      - name: Build native module (Windows x64 MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_BACKTRACE: "1"
          CARGO_TERM_VERBOSE: "true"
          # Ninja handles BoringSSL assembly; VS generator often skips asm steps
          CMAKE_GENERATOR: Ninja
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          CARGO_TARGET_DIR: rust/target
        run: ${{ matrix.settings.build }}

      - name: Build native module (other non-musl targets)
        # Only macOS remains on the host runner. The linux-*-gnu targets are
        # built inside manylinux_2_28 containers below to pin a portable
        # glibc baseline (glibc 2.28). Building on the ubuntu-24.04 runner
        # (glibc 2.39) produces binaries that require GLIBC_2.33/2.34 and fail
        # to load on older glibc (e.g. 2.31 on CentOS/RHEL-family).
        if: runner.os == 'macOS'
        run: ${{ matrix.settings.build }}

      - name: Build native module (x86_64-gnu target, manylinux_2_28)
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            quay.io/pypa/manylinux_2_28_x86_64 \
            sh -lc '
              set -eux
              dnf install -y --disablerepo=epel git make clang-devel
              export LIBCLANG_PATH=/usr/lib64
              curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
              source "$HOME/.cargo/env"
              rustup target add x86_64-unknown-linux-gnu
              curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz \
                | tar -xJ -C /usr/local --strip-components=1
              npm ci --ignore-scripts
              npm run build:rust -- --target x86_64-unknown-linux-gnu
            '

      - name: Build native module (aarch64-gnu target, manylinux_2_28)
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            quay.io/pypa/manylinux_2_28_aarch64 \
            sh -lc '
              set -eux
              dnf install -y --disablerepo=epel git make clang-devel
              export LIBCLANG_PATH=/usr/lib64
              curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
              source "$HOME/.cargo/env"
              rustup target add aarch64-unknown-linux-gnu
              curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-arm64.tar.xz \
                | tar -xJ -C /usr/local --strip-components=1
              npm ci --ignore-scripts
              npm run build:rust -- --target aarch64-unknown-linux-gnu
            '

      - name: Smoke test native addon
        if: runner.os == 'macOS'
        env:
          WREQ_TARGET: ${{ matrix.settings.target }}
        run: node scripts/smoke-native.cjs

      - name: Smoke test native addon (x86_64-gnu, manylinux_2_28)
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        run: |
          docker run --rm \
            -e WREQ_PLATFORM_ARCH=linux-x64-gnu \
            -v "$PWD:/app" \
            -w /app \
            quay.io/pypa/manylinux_2_28_x86_64 \
            sh -lc '
              curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz \
                | tar -xJ -C /usr/local --strip-components=1
              node scripts/smoke-native.cjs
            '

      - name: Smoke test native addon (aarch64-gnu, manylinux_2_28)
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          docker run --rm \
            -e WREQ_PLATFORM_ARCH=linux-arm64-gnu \
            -v "$PWD:/app" \
            -w /app \
            quay.io/pypa/manylinux_2_28_aarch64 \
            sh -lc '
              curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-arm64.tar.xz \
                | tar -xJ -C /usr/local --strip-components=1
              node scripts/smoke-native.cjs
            '

      - name: Smoke test native addon (musl)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          docker run --rm \
            -e WREQ_PLATFORM_ARCH=linux-x64-musl \
            -v "$PWD:/app" \
            -w /app \
            node:20-alpine \
            node scripts/smoke-native.cjs

      - name: Smoke test native addon (arm64 musl)
        if: matrix.settings.target == 'aarch64-unknown-linux-musl'
        run: |
          docker run --rm \
            -e WREQ_PLATFORM_ARCH=linux-arm64-musl \
            -v "$PWD:/app" \
            -w /app \
            node:20-alpine \
            node scripts/smoke-native.cjs

      - name: Normalize platform artifact name
        shell: bash
        run: |
          set -euo pipefail
          # Map rustc target triple → install-native.mjs platform id
          case "${{ matrix.settings.target }}" in
            aarch64-apple-darwin) ARCH=darwin-arm64 ;;
            x86_64-apple-darwin) ARCH=darwin-x64 ;;
            x86_64-unknown-linux-gnu) ARCH=linux-x64-gnu ;;
            aarch64-unknown-linux-gnu) ARCH=linux-arm64-gnu ;;
            x86_64-unknown-linux-musl) ARCH=linux-x64-musl ;;
            aarch64-unknown-linux-musl) ARCH=linux-arm64-musl ;;
            x86_64-pc-windows-msvc) ARCH=win32-x64-msvc ;;
            *) echo "unknown target ${{ matrix.settings.target }}"; exit 1 ;;
          esac
          mkdir -p artifacts-out
          if [ -f "rust/wreq-js.${ARCH}.node" ]; then
            cp "rust/wreq-js.${ARCH}.node" "artifacts-out/wreq-js.${ARCH}.node"
          elif [ -f rust/wreq-js.node ]; then
            cp rust/wreq-js.node "artifacts-out/wreq-js.${ARCH}.node"
          else
            echo "No .node for ${ARCH}"; ls -la rust/ || true; exit 1
          fi
          ls -la artifacts-out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          # Only the correct platform binary (never dump all rust/*.node — may include committed darwin)
          name: bindings-${{ matrix.settings.target }}
          path: artifacts-out/wreq-js.*.node
          if-no-files-found: error

  publish:
    name: Publish Package
    runs-on: ubuntu-24.04
    needs: build_full
    if: always() && !cancelled() && github.event_name == 'release'
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm 11.5.1+ for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci
        env:
          WREQ_JS_SKIP_POSTINSTALL: "1"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: bindings-*
          merge-multiple: true

      - name: Move artifacts to rust directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rust
          # Drop any pre-committed/wrong-platform natives
          rm -f rust/*.node
          find artifacts -name 'wreq-js.*.node' -exec cp -f {} rust/ \;
          echo "Collected binaries:"
          ls -la rust/*.node
          # Required platforms (Windows x64 only — no ia32/arm64)
          for need in linux-x64-gnu linux-arm64-gnu darwin-arm64 darwin-x64 win32-x64-msvc; do
            test -f "rust/wreq-js.${need}.node" || { echo "MISSING rust/wreq-js.${need}.node"; exit 1; }
          done

      - name: Build TypeScript
        run: npm run build:ts

      - name: Publish to npm with trusted publishing
        run: npm publish --provenance --access public
