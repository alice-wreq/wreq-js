name: build-and-release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
  repository_dispatch:
    types: [wreq-rust-updated]

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: darwin-arm64
          # macos-13 (darwin-x64) excluded: runner/build unreliable
          - os: ubuntu-22.04
            triple: linux-x64-gnu
          - os: ubuntu-22.04-arm
            triple: linux-arm64-gnu
    runs-on: ${{ matrix.os }}
    # free-tier arm runners may be unavailable
    continue-on-error: ${{ matrix.triple == 'linux-arm64-gnu' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux build deps (cmake for btls/boringssl)
        if: runner.os == 'macOS'
        run: true

      - name: Install deps
        if: runner.os == 'macOS'
        run: npm ci || npm install
        env:
          WREQ_JS_SKIP_POSTINSTALL: "1"

      - name: Build native + TS (macOS host)
        if: runner.os == 'macOS'
        run: |
          rm -f rust/*.node
          npm run build:rust
          npm run build:ts
        env:
          WREQ_JS_SKIP_POSTINSTALL: "1"

      - name: Build native (linux-x64-gnu, manylinux_2_28)
        if: matrix.triple == 'linux-x64-gnu'
        run: |
          rm -f rust/*.node
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            quay.io/pypa/manylinux_2_28_x86_64 \
            sh -lc '
              set -eux
              dnf install -y --disablerepo=epel git make clang-devel
              export LIBCLANG_PATH=/usr/lib64
              curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
              source "$HOME/.cargo/env"
              rustup target add x86_64-unknown-linux-gnu
              curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz \
                | tar -xJ -C /usr/local --strip-components=1
              npm ci --ignore-scripts || npm install --ignore-scripts
              npm run build:rust -- --target x86_64-unknown-linux-gnu
            '

      - name: Build native (linux-arm64-gnu, manylinux_2_28)
        if: matrix.triple == 'linux-arm64-gnu'
        run: |
          rm -f rust/*.node
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            quay.io/pypa/manylinux_2_28_aarch64 \
            sh -lc '
              set -eux
              dnf install -y --disablerepo=epel git make clang-devel
              export LIBCLANG_PATH=/usr/lib64
              curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
              source "$HOME/.cargo/env"
              rustup target add aarch64-unknown-linux-gnu
              curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-arm64.tar.xz \
                | tar -xJ -C /usr/local --strip-components=1
              npm ci --ignore-scripts || npm install --ignore-scripts
              npm run build:rust -- --target aarch64-unknown-linux-gnu
            '

      - name: Normalize artifact name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -f "rust/wreq-js.${{ matrix.triple }}.node" ]; then
            cp "rust/wreq-js.${{ matrix.triple }}.node" "artifacts/wreq-js.${{ matrix.triple }}.node"
          elif [ -f rust/wreq-js.node ]; then
            cp rust/wreq-js.node "artifacts/wreq-js.${{ matrix.triple }}.node"
          else
            echo "No .node found"; ls -la rust/; exit 1
          fi
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.triple }}
          path: artifacts/wreq-js.${{ matrix.triple }}.node

  release:
    needs: build
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: node-*
          merge-multiple: true

      - name: List + require core natives
        run: |
          set -euo pipefail
          find artifacts -type f -ls || true
          mkdir -p release-assets
          find artifacts -name 'wreq-js.*.node' -exec cp -f {} release-assets/ \;
          ls -la release-assets/
          # linux-x64-gnu is required; arm64 best-effort
          test -f release-assets/wreq-js.linux-x64-gnu.node
          test -f release-assets/wreq-js.darwin-arm64.node

      - name: Publish GitHub Release (rolling latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.sha) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GITHUB_TOKEN-created Releases do not trigger other workflows' `on: release`.
  # Publish npm in this same workflow on version tags so it always runs.
  npm-publish:
    name: Publish npm package
    needs: [build, release]
    # Only version tags (v3.0.0) — not every main push prerelease build-*
    if: >
      always() && !cancelled() &&
      needs.release.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install deps
        run: npm ci || npm install
        env:
          WREQ_JS_SKIP_POSTINSTALL: "1"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: node-*
          merge-multiple: true

      - name: Stage natives + build TS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rust
          rm -f rust/*.node
          find artifacts -name 'wreq-js.*.node' -exec cp -f {} rust/ \;
          ls -la rust/*.node
          # Core platforms for alice (darwin-x64 optional — not in this matrix)
          test -f rust/wreq-js.linux-x64-gnu.node
          test -f rust/wreq-js.darwin-arm64.node
          npm run build:ts

      - name: Publish to npm
        run: npm publish --provenance --access public
