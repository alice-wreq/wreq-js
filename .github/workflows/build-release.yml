name: build-and-release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
  repository_dispatch:
    types: [wreq-rust-updated]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: darwin-arm64
          - os: macos-13
            triple: darwin-x64
          - os: ubuntu-22.04
            triple: linux-x64-gnu
          - os: ubuntu-22.04-arm
            triple: linux-arm64-gnu
    runs-on: ${{ matrix.os }}
    # free-tier arm runners may be unavailable
    continue-on-error: ${{ matrix.triple == 'linux-arm64-gnu' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux build deps (cmake for btls/boringssl)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential pkg-config cmake libssl-dev

      - name: Install deps
        run: npm ci || npm install
        env:
          WREQ_JS_SKIP_POSTINSTALL: "1"

      - name: Build native + TS
        run: |
          # clear any committed foreign-platform .node
          rm -f rust/*.node
          npm run build:rust
          npm run build:ts
        env:
          WREQ_JS_SKIP_POSTINSTALL: "1"

      - name: Normalize artifact name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -f "rust/wreq-js.${{ matrix.triple }}.node" ]; then
            cp "rust/wreq-js.${{ matrix.triple }}.node" "artifacts/wreq-js.${{ matrix.triple }}.node"
          elif [ -f rust/wreq-js.node ]; then
            cp rust/wreq-js.node "artifacts/wreq-js.${{ matrix.triple }}.node"
          else
            echo "No .node found"; ls -la rust/; exit 1
          fi
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.triple }}
          path: artifacts/wreq-js.${{ matrix.triple }}.node

  release:
    needs: build
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: node-*
          merge-multiple: true

      - name: List + require core natives
        run: |
          set -euo pipefail
          find artifacts -type f -ls || true
          mkdir -p release-assets
          find artifacts -name 'wreq-js.*.node' -exec cp -f {} release-assets/ \;
          ls -la release-assets/
          # linux-x64-gnu is required; arm64 best-effort
          test -f release-assets/wreq-js.linux-x64-gnu.node
          test -f release-assets/wreq-js.darwin-arm64.node

      - name: Publish GitHub Release (rolling latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.sha) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
