[package]
name = "wreq-js"
version = "3.2.2"
edition = "2024"
license = "MIT"
authors = ["Oleksandr Herasymov", "will-work-for-meal"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# HTTP client with browser impersonation.
wreq = { git = "https://github.com/alice-wreq/wreq-rust", rev = "927cc20cc7c8c15e8d8a6eaf7939a37e92650b7a", default-features = false, features = ["cookies", "gzip", "brotli", "deflate", "zstd", "charset", "system-proxy", "socks", "ws", "stream", "webpki-roots", "tokio-rt"] }
wreq-util = { path = "../vendor/wreq-util", features = ["emulation-serde", "tokio-rt", "emulation-compression"] }
webpki-root-certs = "1.0.11"

# WebSocket support
futures-util = "0.3.34"

# Byte buffers for streaming bodies
bytes = "1.12.1"

# Cookie construction for Session.setCookies (must track wreq's cookie dependency)
cookie = "0.18.2"

# Neon for Node.js bindings
neon = { version = "1.1.2", default-features = false, features = ["napi-6"] }

# Concurrent maps
dashmap = "6.2.1"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Error handling
anyhow = "1.0.104"

# Async runtime
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros"] }
tokio-util = "0.7.20"

# Global state management
moka = { version = "0.12.16", features = ["sync"] }
uuid = { version = "1.29.0", features = ["v4"] }

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wreq-util = { path = "../vendor/wreq-util", features = ["emulation-serde", "tokio-rt", "emulation-compression"] }

[dev-dependencies]
btls = { git = "https://github.com/alice-wreq/btls", tag = "alice-v0.5.6" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
