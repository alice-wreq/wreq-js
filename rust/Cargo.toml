[package]
name = "wreq-js"
version = "3.2.0"
edition = "2024"
license = "MIT"
authors = ["Oleksandr Herasymov", "will-work-for-meal"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# HTTP client with browser impersonation.
# The crates.io requirement is kept as-is; [patch.crates-io] below swaps in the
# alice-wreq/wreq-rust fork (also for vendor/wreq-util, so only one wreq is built).
wreq = { version = "0.16.3", default-features = false, features = ["cookies", "gzip", "brotli", "deflate", "zstd", "charset", "system-proxy", "socks", "ws", "stream", "webpki-roots", "tokio-rt"] }
wreq-util = { path = "../vendor/wreq-util", features = ["emulation-serde", "tokio-rt", "emulation-compression"] }
webpki-root-certs = "1.0.11"

# WebSocket support
futures-util = "0.3.34"

# Byte buffers for streaming bodies
bytes = "1.12.1"

# Cookie construction for Session.setCookies (must track wreq's cookie dependency)
cookie = "0.18.2"

# Neon for Node.js bindings
neon = { version = "1.1.2", default-features = false, features = ["napi-6"] }

# Concurrent maps
dashmap = "6.2.1"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Error handling
anyhow = "1.0.104"

# Async runtime
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros"] }
tokio-util = "0.7.20"

# Global state management
moka = { version = "0.12.16", features = ["sync"] }
uuid = { version = "1.29.0", features = ["v4"] }

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wreq-util = { path = "../vendor/wreq-util", features = ["emulation-serde", "tokio-rt", "emulation-compression"] }

[dev-dependencies]
btls = "0.5.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

# alice-wreq: engine = alice-wreq/wreq-rust (upstream wreq v0.16.3 + force_absolute).
# Pinned to a tag for reproducible native builds. For local engine work, override with:
#   cargo build --config 'patch.crates-io.wreq.path="../../wreq-rust"'
[patch.crates-io]
wreq = { git = "https://github.com/alice-wreq/wreq-rust", tag = "alice-v0.16.3" }
